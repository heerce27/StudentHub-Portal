<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <!-- Header -->
    <header>
        <div class="logo">
            StudentHub
        </div>
        <nav>
            <ul>
                <li><a href="../html/index.html">Home</a></li>
                <li>
                    <a href="../html/login.html">
                        <button class="btn btn-primary">Login</button>
                    </a>
                </li>

                <li>
                    <a href="../html/register.html">
                        <button class="btn btn-secondary">Register</button>
                    </a>
                </li>
            </ul>
        </nav>
    </header>
    <!-- Login Form -->
    <main>

        <div class="form-box">

            <h2>Welcome Back!</h2>

            <p style="text-align:center; color:var(--text-light); margin-bottom:25px;">
                Login to continue to your StudentHub account.
            </p>

            
<form id="loginForm" method="POST" action="../php/process_login.php">

    <div class="form-group">
        <label for="account_type">Login as</label>
        <select id="account_type" name="account_type" required>
            <option value="student">Student</option>
            <option value="admin">Admin</option>
        </select>
    </div>

    <div class="form-group">
        <label for="login_id" id="login_id_label">
            Student ID
        </label>

        <input
            type="text"
            id="login_id"
            name="login_id"
            placeholder="Enter your Student ID"
            required>
    </div>

    <div class="form-group">
        <label for="LoginPassword">Password</label>

        <input
            type="password"
            id="LoginPassword"
            name="password"
            placeholder="Enter your password"
            required>
    </div>

    <div style="display:flex; gap:10px;">
        <button type="submit" class="btn btn-primary"
                style="flex:1;">
            Login
        </button>

        <button type="reset" class="btn btn-secondary"
                style="flex:1;">
            Clear
        </button>
    </div>

</form>

            <br>
            <p style="text-align:center;">
                New Student?
                <a
                    href="../html/register.html"
                    style="color:var(--primary); font-weight:600;">
                    Register Here
                </a>
            </p>
        </div>
    </main>
    <!-- Footer -->
    <footer>
        © 2026 StudentHub. All Rights Reserved.
    </footer>
    
<script>
const accountType = document.getElementById('account_type');
const loginLabel = document.getElementById('login_id_label');
const loginInput = document.getElementById('login_id');

accountType.addEventListener('change', function () {
    if (this.value === 'admin') {
        loginLabel.textContent = 'Admin Username';
        loginInput.placeholder = 'Enter your admin username';
    } else {
        loginLabel.textContent = 'Student ID';
        loginInput.placeholder = 'Enter your Student ID';
    }
});
</script>

    <script src="../js/script.js"></script>
</body>
</html>
